<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="assets/css/style.css">
        <title>Couleurs et images</title>
    </head>

    <body>
        <header>
            <h1>Bienvenue sur notre titre d'exemple !</h1>
        </header>

        <nav>
            <span> Introduction</span>
            <span> Galerie</span>
            <span> Contact</span>
        </nav>

        <main class="container">
            <section id="introduction" class="intro">
                <h2>Introduction</h2>
                <p>Ceci est un exemple de page HTML contenant différents éléments que vous pouvez manipuler avec du
                    CSS.</p>

            </section>

            <section class="gallery">
                <h2>Galerie d'images</h2>
                <div class="images-container">
                    <div class="imagesPortrait" id="un">
                        <img src="assets/images/arbre-dessous-min.jpg" alt="Image vue du dessous d'un arbre en automne">
                    </div>
                    <div class="imagesPaysage" id="deux">
                        <img src="assets/images/arbre-pied-min.jpg" alt="Image du pied d'un arbre">
                    </div>
                    <div class="imagesPaysage" id="trois">
                        <img src="assets/images/arbres-brume-min.jpg" alt="Image de forêt avec de la brume">
                    </div>
                    <div class="imagesPortrait" id="quatre">
                        <img src="assets/images/arbres-rouges-min.jpg" alt="Image d'arbres avec des feuilles rouges">
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Exemple de Site Web</p>
        </footer>
    </body>
</html>
